[workspace]
resolver = "3"
members = [
    "crates/pinna-core",
    "crates/pinna-engine",
    "crates/pinna-analysis",
    "crates/pinna",
    "crates/pinna-studio",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robinchoice/pinna"
publish = false

[workspace.dependencies]
pinna-core = { path = "crates/pinna-core" }
pinna-engine = { path = "crates/pinna-engine" }
pinna-analysis = { path = "crates/pinna-analysis" }
pinna = { path = "crates/pinna" }

# Full debuginfo made every test and binary ~470 MB and target/ grew ~18 GB a day.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

# Live playback (and its tests) runs in real time: the engine renders at release
# speed in every profile.
[profile.dev.package.pinna-engine]
opt-level = 3
