[package]
name = "pinna"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
pinna-analysis.workspace = true
pinna-core.workspace = true
pinna-engine.workspace = true
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.6.0", features = ["client", "transport-child-process"] }
tempfile = "3.27.0"
