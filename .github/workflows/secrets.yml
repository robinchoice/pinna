name: Secrets

# Scan public commits with gitleaks defaults plus .gitleaks.toml.
# No paths-ignore: docs and app files can both contain secrets.
on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    # Branches of this repo are scanned on push already, PRs only add forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Without a known base, scan commits outside the default branch, or all history
      # on the default branch itself; skip other branches and tags with no new commits.
      # -m includes merge conflict resolutions; fork PRs use base config and ignores.
      # --redact keeps found values out of the log, which is public too.
      - name: Scan new commits with gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
          CONFIG_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          elif [ "$(git rev-list --count "$HEAD" --not "origin/$DEFAULT_BRANCH")" -gt 0 ]; then
            range="$HEAD --not origin/$DEFAULT_BRANCH"
          elif [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            range="$HEAD"
          else
            echo "No new commits to scan"
            exit 0
          fi
          scan_config="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          git show "$CONFIG_REF:.gitleaks.toml" > "$scan_config/gitleaks.toml" 2>/dev/null \
            || printf '[extend]\nuseDefault = true\n' > "$scan_config/gitleaks.toml"
          git show "$CONFIG_REF:.gitleaksignore" > "$scan_config/.gitleaksignore" 2>/dev/null || true
          # Gitleaks also loads the checkout's ignore file despite --gitleaks-ignore-path.
          cp --remove-destination "$scan_config/.gitleaksignore" .gitleaksignore
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo" -v "$scan_config:/scan:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --verbose --config=/scan/gitleaks.toml \
            --gitleaks-ignore-path=/scan/.gitleaksignore --log-opts="-m $range"
